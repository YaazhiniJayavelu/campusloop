{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card"><div class="card-body p-4"><h1 class="h3">Create a poll</h1><form method="post"><label class="form-label">Question *</label><input class="form-control mb-3" name="question" maxlength="240" required placeholder="What should campus improve next?"><label class="form-label">Options * (one per line, 2–10 options)</label><textarea class="form-control mb-4" name="options" rows="6" required placeholder="More study spaces&#10;Better cafeteria options&#10;More campus events"></textarea><button class="btn btn-primary">Publish poll</button> <a class="btn btn-light" href="{{ url_for('campus.feedback') }}">Cancel</a></form></div></div></div></div>{% endblock %}
