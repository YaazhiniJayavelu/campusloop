{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card"><div class="card-body p-4"><h1 class="h3">List a marketplace item</h1><form method="post" enctype="multipart/form-data"><label class="form-label">Item name *</label><input class="form-control mb-3" name="title" maxlength="140" required><label class="form-label">Category *</label><select class="form-select mb-3" name="category" required><option value="">Choose a category</option>{% for c in ['Books','Electronics','Stationery','Lab equipment','Clothing','Hostel essentials','Other'] %}<option>{{ c }}</option>{% endfor %}</select><label class="form-label">Price (₹) *</label><input class="form-control mb-3" type="number" name="price" min="0" max="99999999.99" step="0.01" value="0" required><label class="form-label">Description</label><textarea class="form-control mb-3" name="description" rows="3"></textarea><label class="form-label">Photo (optional)</label><input class="form-control mb-4" type="file" name="photo" accept=".png,.jpg,.jpeg,.webp,.gif"><button class="btn btn-primary">Publish listing</button> <a class="btn btn-light" href="{{ url_for('campus.marketplace') }}">Cancel</a></form></div></div></div></div>{% endblock %}
