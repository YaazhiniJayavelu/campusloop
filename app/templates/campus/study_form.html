{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card"><div class="card-body p-4"><h1 class="h3">Share a study resource</h1><p class="text-secondary">Allowed formats: PDF, DOC/DOCX, PPT/PPTX and TXT. Max upload size follows the app's 5 MB limit.</p><form method="post" enctype="multipart/form-data"><label class="form-label">Title *</label><input class="form-control mb-3" name="title" maxlength="140" required><label class="form-label">Subject *</label><input class="form-control mb-3" name="subject" maxlength="100" required placeholder="e.g. Data Structures"><label class="form-label">Description</label><textarea class="form-control mb-3" name="description" rows="3"></textarea><label class="form-label">File *</label><input class="form-control mb-4" type="file" name="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.txt" required><button class="btn btn-primary">Publish resource</button> <a class="btn btn-light" href="{{ url_for('campus.study') }}">Cancel</a></form></div></div></div></div>{% endblock %}
