{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card"><div class="card-body p-4"><h1 class="h3">Create a campus event</h1><form method="post"><label class="form-label">Event title *</label><input class="form-control mb-3" name="title" maxlength="140" required><label class="form-label">Date & time *</label><input class="form-control mb-3" type="datetime-local" name="starts_at" required><label class="form-label">Venue *</label><input class="form-control mb-3" name="venue" maxlength="140" required><label class="form-label">Club (optional)</label><input class="form-control mb-3" name="club_name" maxlength="120"><label class="form-label">Description</label><textarea class="form-control mb-4" name="description" rows="4"></textarea><button class="btn btn-primary">Publish event</button> <a class="btn btn-light" href="{{ url_for('campus.events') }}">Cancel</a></form></div></div></div></div>{% endblock %}
